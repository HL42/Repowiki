# RepoWiki GitLab CI/CD
# 推送版本标签 (v1.0.0) 时自动构建 Mac + Windows 安装包并发布到 Release 页面

stages:
  - build
  - package

variables:
  GO_VERSION: "1.23"
  NODE_VERSION: "20"

# ============================================================
# Stage 1: 构建前端
# ============================================================
build-frontend:
  stage: build
  image: node:${NODE_VERSION}-alpine
  cache:
    key:
      files:
        - frontend/package-lock.json
    paths:
      - frontend/node_modules/
  artifacts:
    paths:
      - frontend/dist/
    expire_in: 1 day
  script:
    - cd frontend
    - npm ci
    - npm run build

# ============================================================
# Stage 2: 三平台并行交叉编译 + 打包 .zip
# ============================================================
package:
  stage: package
  needs:
    - build-frontend
  image: golang:${GO_VERSION}-alpine
  parallel:
    matrix:
      - PLATFORM: darwin-arm64
        GOOS: darwin
        GOARCH: arm64
        BINARY: repowiki

      - PLATFORM: darwin-amd64
        GOOS: darwin
        GOARCH: amd64
        BINARY: repowiki

      - PLATFORM: windows-amd64
        GOOS: windows
        GOARCH: amd64
        BINARY: repowiki.exe

  artifacts:
    name: "repowiki-${CI_COMMIT_TAG}-${PLATFORM}"
    paths:
      - "release/repowiki-${CI_COMMIT_TAG}-${PLATFORM}.zip"
    expire_in: 30 days

  before_script:
    - apk add --no-cache zip

  script:
    - export VERSION="${CI_COMMIT_TAG#v}"
    - echo "构建 RepoWiki v$VERSION → $PLATFORM"

    # 交叉编译
    - CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH
      go build -ldflags="-s -w -X main.Version=$VERSION"
      -o $BINARY ./cmd/...

    # 组装安装包
    - mkdir -p release/pkg/frontend/dist
    - cp $BINARY release/pkg/
    - cp -r frontend/dist/* release/pkg/frontend/dist/
    - cp .env.example release/pkg/

    # Mac: 用 .command 扩展名（Finder 双击即启动）
    # Win: 用 .bat
    - |
      if [ "$GOOS" = "windows" ]; then
        cp scripts/start.bat release/pkg/
      else
        cp scripts/start.sh release/pkg/start.command
        chmod +x release/pkg/$BINARY
      fi

    # 打包为 .zip
    - cd release
    - zip -qr "repowiki-${VERSION}-${PLATFORM}.zip" pkg/
    - cd ..

    - echo "✅ $PLATFORM 构建完成"

# ============================================================
# 发布说明：
#
# 构建完成后，在 GitLab 项目左侧 → Deploy → Releases → New release：
#   1. Tag: v1.0.0
#   2. 上传三个 .zip 文件（从 Pipeline artifacts 下载）
#   3. Release notes 写：
#
#      ## 下载
#      - [macOS Apple Silicon]  ← 链接 darwin-arm64.zip
#      - [macOS Intel]           ← 链接 darwin-amd64.zip
#      - [Windows x64]           ← 链接 windows-amd64.zip
#
#      ## 安装
#      Mac: 解压后双击 start.command
#      Windows: 解压后双击 start.bat
#      首次运行需输入 DeepSeek API Key
#
# 4. 保存 → 员工就能在 Release 页面下载了
# ============================================================
